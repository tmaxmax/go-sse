name: Go

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "cmd/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "cmd/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
  test:
    name: Test (minimum supported major)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -v -timeout=10s -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Test (race)
        run: go test -v -timeout=10s -race ./...
      - name: Coverage
        uses: codecov/codecov-action@v7
        if: github.ref == 'refs/head/master'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
  test-old:
    name: Test (latest stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Test
        run: go test -v -timeout=10s ./...
      - name: Test (race)
        run: go test -v -timeout=10s -race ./...
